AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The Glam Muse Experience — static Astro site (private S3 + CloudFront via OAC),
  an S3 media bucket, and the ActiveCampaign lead-capture proxy (API Gateway
  HTTP API + Lambda) with the AC API key held in Secrets Manager. Static output
  only; no SSR, no runtime database. See aws/README.md for the deploy runbook.

# ---------------------------------------------------------------------------
# Parameters — every env-specific value. AcApiKey is deliberately NOT here: the
# key must never transit CloudFormation. It is set out-of-band on the secret.
# ---------------------------------------------------------------------------
Parameters:
  AcApiUrl:
    Type: String
    Description: ActiveCampaign account API base URL, e.g. https://acct.api-us1.com
  AcListId:
    Type: String
    Description: ActiveCampaign list id the inquire is subscribed to (status 1).
  AcListIdGiveaway:
    Type: String
    Default: ''
    Description: >-
      Optional ActiveCampaign list id for the engagement-giveaway landing page
      (forms that POST list=giveaway subscribe here instead of AcListId). Leave
      empty to route giveaway entries to the default AcListId until the separate
      list is set up.
  AcListIdWeddings:
    Type: String
    Default: ''
    Description: >-
      Optional ActiveCampaign list id for wedding inquiries (the
      /weddings/inquire form POSTs list=weddings). e.g. 55. Leave empty to route
      wedding inquiries to the default AcListId until the separate list exists.
  AcTags:
    Type: String
    Default: ''
    Description: Optional comma-separated AC tag ids applied best-effort.
  AcFieldReason:
    Type: String
    Default: ''
    Description: Optional AC custom-field id mapped from the form 'reason' field.
  AcFieldMore:
    Type: String
    Default: ''
    Description: Optional AC custom-field id mapped from the form 'more' field.
  AcFieldFeel:
    Type: String
    Default: ''
    Description: Optional AC custom-field id mapped from the form 'feel' field.
  AcFieldHear:
    Type: String
    Default: ''
    Description: Optional AC custom-field id mapped from the form 'hear' field.
  AcFieldGroom:
    Type: String
    Default: ''
    Description: Optional AC custom-field id for the giveaway 'groom' full name.
  AcFieldPartner:
    Type: String
    Default: ''
    Description: Optional AC custom-field id for the weddings 'partner' full name.
  AcFieldDate:
    Type: String
    Default: ''
    Description: Optional AC custom-field id for the weddings 'date' (wedding date).
  AcFieldVenue:
    Type: String
    Default: ''
    Description: Optional AC custom-field id for the weddings 'venue' field.
  AcFieldWhy:
    Type: String
    Default: ''
    Description: Optional AC custom-field id for the weddings 'why' field.
  AcFieldVision:
    Type: String
    Default: ''
    Description: Optional AC custom-field id for the weddings 'vision' field.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: >-
      CORS allowed origin for the AC proxy. TODO: restrict AllowedOrigin to the
      CloudFront distribution domain (https://dXXXX.cloudfront.net or the custom
      domain) before production; '*' is for bring-up only.
  ContactSuccessUrl:
    Type: String
    Default: ''
    Description: >-
      Redirect target for the no-JS native form fallback. Leave empty on first
      bring-up (the Lambda returns minimal inline HTML); set to
      https://<CloudFrontDomainName>/inquire on the hardening redeploy.
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >-
      ACM certificate ARN for the CloudFront viewer certificate. MUST be in
      us-east-1 regardless of the stack region. Leave empty for a provisional
      bring-up: CloudFront then serves on its default *.cloudfront.net domain
      using the free CloudFront default certificate (no ACM/DNS required).
      Supply the ARN (together with DomainName) on the hardening redeploy.
  OAuthClientId:
    Type: String
    Default: ''
    Description: >-
      GitHub OAuth App client id for the CMS admin login relay. Leave empty to
      skip the OAuth relay entirely (the /admin login will not work until set).
      The paired client secret is set out-of-band on the OAuth secret, never here.
  OAuthLambdaS3Key:
    Type: String
    Default: 'oauth-lambda.zip'
    Description: >-
      S3 key of the OAuth relay Lambda zip in the same bucket as the AC Lambda
      zip (muse-photographer-site). Only used when OAuthClientId is set.
  CmsRepo:
    Type: String
    Description: GitHub repo (owner/name) for the CMS backend (documentation/output only).
  CmsBranch:
    Type: String
    Description: GitHub branch for the CMS backend (documentation/output only).
  DomainName:
    Type: String
    Default: ''
    Description: >-
      Custom domain (alias) for CloudFront — the apex: luisquintanastudio.com.
      The whole site serves from this one domain with path-based sections
      (/muse, /weddings). When empty, the default *.cloudfront.net domain is
      used and no Aliases are set. The ACM cert in AcmCertificateArn must cover
      this name (a wildcard *.luisquintanastudio.com or an apex SAN cert).
  WwwDomainName:
    Type: String
    Default: ''
    Description: >-
      Optional www alias, e.g. www.luisquintanastudio.com. Set this so the
      distribution serves HTTPS for the www host too (a www CNAME -> the
      distribution needs www in Aliases, or the browser gets
      ERR_SSL_VERSION_OR_CIPHER_MISMATCH). The ACM cert MUST cover this name
      (a wildcard *.luisquintanastudio.com covers www; the bare apex needs its
      own SAN on the cert).
  WeddingsDomainName:
    Type: String
    Default: ''
    Description: >-
      DEPRECATED — no longer used (site moved to path-based sections). Leave
      empty. Retained as a no-op so older deploy scripts don't error.
  GitHubRepo:
    Type: String
    Default: ''
    Description: >-
      GitHub repo (owner/name) allowed to assume the CI/CD deploy role via OIDC,
      e.g. emgeier/PhotographerSite. Leave empty to skip the CI/CD role entirely.
  GitHubBranch:
    Type: String
    Default: 'main'
    Description: >-
      Branch whose workflow runs may assume the deploy role (sub claim is scoped
      to refs/heads/<branch>). Only used when GitHubRepo is set.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether to create the account's GitHub OIDC provider. An AWS account may
      have only ONE provider for token.actions.githubusercontent.com; set this
      to 'false' if the account already has one (the role then references the
      existing provider ARN). Only used when GitHubRepo is set.

Conditions:
  # When no ACM cert is supplied we are in provisional bring-up: CloudFront
  # uses its own default certificate on the *.cloudfront.net domain.
  HasAcmCertificate: !Not [!Equals [!Ref AcmCertificateArn, '']]
  # A custom-domain alias is only valid alongside a matching ACM cert.
  # CloudFront rejects Aliases when using the default certificate, so require
  # BOTH a domain name and a cert before setting Aliases.
  HasDomainName: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref AcmCertificateArn, '']]
  # The www alias is added when WwwDomainName is set alongside a cert
  # (CloudFront rejects Aliases without a matching ACM cert).
  HasWwwDomain: !And
    - !Not [!Equals [!Ref WwwDomainName, '']]
    - !Not [!Equals [!Ref AcmCertificateArn, '']]
  # Both apex + www together (controls the two-alias list form).
  HasApexAndWww: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref WwwDomainName, '']]
    - !Not [!Equals [!Ref AcmCertificateArn, '']]
  # CI/CD: create the deploy role only when a GitHub repo is supplied.
  HasGitHubRepo: !Not [!Equals [!Ref GitHubRepo, '']]
  # CMS login: create the OAuth relay only when a client id is supplied.
  HasOAuth: !Not [!Equals [!Ref OAuthClientId, '']]
  # Create the OIDC provider only when both: a repo is set AND the toggle is on.
  CreateOidcProvider: !And
    - !Not [!Equals [!Ref GitHubRepo, '']]
    - !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # -------------------------------------------------------------------------
  # S3 buckets — both private; reached only through CloudFront via OAC.
  # -------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # -------------------------------------------------------------------------
  # CloudFront — OAC to both buckets, ACM HTTPS, clean-URL function.
  # -------------------------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CleanUrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-clean-urls'
      AutoPublish: true
      FunctionConfig:
        Comment: Clean URLs (single-domain, path-based sections).
        Runtime: cloudfront-js-2.0
      # Single domain (luisquintanastudio.com), path-based sections:
      #   /                 -> /index.html          (apex studio hub)
      #   /muse, /weddings  -> /<path>/index.html   (brand sections)
      # Pure clean-URL rewrite — no per-host branching. The former
      # weddings-subdomain root rewrite was removed with the move to paths.
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Pass through any URI that already has a file extension (incl. .html,
          // .css, images), so real assets and /404.html are served untouched.
          var lastSegment = uri.split('/').pop();
          if (lastSegment.indexOf('.') !== -1) {
            return request;
          }
          // Trailing slash -> append index.html; otherwise -> append /index.html.
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} static site'
        DefaultRootObject: index.html
        # Aliases for the single domain: apex and/or www, whichever are set
        # (each must be covered by the ACM cert). A www CNAME to the
        # distribution only works over HTTPS when www is listed here.
        Aliases: !If
          - HasApexAndWww
          - [!Ref DomainName, !Ref WwwDomainName]
          - !If
            - HasDomainName
            - [!Ref DomainName]
            - !If
              - HasWwwDomain
              - [!Ref WwwDomainName]
              - !Ref AWS::NoValue
        Origins:
          - Id: site-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: media-origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed cache policy "CachingOptimized".
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CleanUrlFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Exactly one ordered behavior: /media/* -> media origin. /images/*
          # intentionally stays on the default (site) origin — do NOT add an
          # /images/* behavior here (it would 403/404 every site image).
          - PathPattern: /media/*
            TargetOriginId: media-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate: !If
          - HasAcmCertificate
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          # Provisional bring-up: free CloudFront default cert on *.cloudfront.net.
          - CloudFrontDefaultCertificate: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}'

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${MediaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}'

  # -------------------------------------------------------------------------
  # Secrets Manager — AC API key. Bare-string placeholder; set real value
  # out-of-band via `aws secretsmanager put-secret-value` (see runbook).
  # -------------------------------------------------------------------------
  AcSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-ac-api-key'
      Description: ActiveCampaign API key for the lead-capture proxy (set out-of-band).
      SecretString: REPLACE_ME

  # -------------------------------------------------------------------------
  # Lambda — the AC proxy. No AC_API_KEY env; only AC_SECRET_ARN.
  # -------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-ac-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AcSecret

  AcFunction:
    Type: AWS::Lambda::Function
    Properties:
      # nodejs18.x bundles @aws-sdk/client-secrets-manager in the runtime image,
      # which the handler imports at request time. nodejs20.x dropped the bundled
      # SDK, so with a source-only zip the AC proxy would 500 on form submit.
      Runtime: nodejs18.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: muse-photographer-site
        S3Key: ac-lambda.zip
      Environment:
        Variables:
          AC_API_URL: !Ref AcApiUrl
          AC_LIST_ID: !Ref AcListId
          AC_LIST_ID_GIVEAWAY: !Ref AcListIdGiveaway
          AC_LIST_ID_WEDDINGS: !Ref AcListIdWeddings
          AC_TAGS: !Ref AcTags
          AC_FIELD_REASON: !Ref AcFieldReason
          AC_FIELD_MORE: !Ref AcFieldMore
          AC_FIELD_FEEL: !Ref AcFieldFeel
          AC_FIELD_HEAR: !Ref AcFieldHear
          AC_FIELD_GROOM: !Ref AcFieldGroom
          AC_FIELD_PARTNER: !Ref AcFieldPartner
          AC_FIELD_DATE: !Ref AcFieldDate
          AC_FIELD_VENUE: !Ref AcFieldVenue
          AC_FIELD_WHY: !Ref AcFieldWhy
          AC_FIELD_VISION: !Ref AcFieldVision
          CORS_ALLOW_ORIGIN: !Ref AllowedOrigin
          CONTACT_SUCCESS_URL: !Ref ContactSuccessUrl
          AC_SECRET_ARN: !Ref AcSecret

  AcLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AcFunction}'
      RetentionInDays: 7

  # -------------------------------------------------------------------------
  # API Gateway HTTP API — POST + OPTIONS /ac/subscribe -> Lambda.
  # CORS is handled in the Lambda, so API-level CORS is left unset.
  # -------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-ac-api'
      ProtocolType: HTTP

  AcIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AcFunction.Arn
      PayloadFormatVersion: '2.0'

  AcRoutePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /ac/subscribe'
      Target: !Sub 'integrations/${AcIntegration}'

  AcRouteOptions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'OPTIONS /ac/subscribe'
      Target: !Sub 'integrations/${AcIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AcFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/ac/subscribe'

  # -------------------------------------------------------------------------
  # CMS admin login — GitHub OAuth relay (Lambda + /auth and /callback routes
  # on the existing HTTP API). Created only when OAuthClientId is set. The
  # GitHub OAuth App client SECRET is held in Secrets Manager (set out-of-band),
  # never in the template or an env var — same pattern as the AC key.
  # -------------------------------------------------------------------------
  OAuthSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasOAuth
    Properties:
      Name: !Sub '${AWS::StackName}-oauth-client-secret'
      Description: GitHub OAuth App client secret for the CMS login relay (set out-of-band).
      SecretString: REPLACE_ME

  OAuthLambdaRole:
    Type: AWS::IAM::Role
    Condition: HasOAuth
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-oauth-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OAuthSecret

  OAuthFunction:
    Type: AWS::Lambda::Function
    Condition: HasOAuth
    Properties:
      Runtime: nodejs18.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt OAuthLambdaRole.Arn
      Code:
        S3Bucket: muse-photographer-site
        S3Key: !Ref OAuthLambdaS3Key
      Environment:
        Variables:
          OAUTH_CLIENT_ID: !Ref OAuthClientId
          OAUTH_SECRET_ARN: !Ref OAuthSecret

  OAuthLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasOAuth
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OAuthFunction}'
      RetentionInDays: 7

  OAuthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: HasOAuth
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OAuthFunction.Arn
      PayloadFormatVersion: '2.0'

  OAuthRouteAuth:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasOAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /auth'
      Target: !Sub 'integrations/${OAuthIntegration}'

  OAuthRouteCallback:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasOAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /callback'
      Target: !Sub 'integrations/${OAuthIntegration}'

  OAuthInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasOAuth
    Properties:
      FunctionName: !Ref OAuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # -------------------------------------------------------------------------
  # CI/CD — GitHub Actions deploys via OIDC (no long-lived keys). The role is
  # assumable only by workflow runs from GitHubRepo on GitHubBranch, and may
  # only write the site bucket + invalidate THIS distribution. Created only
  # when GitHubRepo is set (see Conditions).
  # -------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub's OIDC thumbprint. IAM no longer enforces it for this well-known
      # provider, but the property is still required by CloudFormation.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubRepo
    Properties:
      Description: Assumed by GitHub Actions (OIDC) to deploy the static site.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # This account emits an ID-augmented OIDC subject, e.g.
                #   repo:emgeier@115035002/PhotographerSite@1403470797:ref:refs/heads/main
                # (the "include repository id in the subject" customization). A
                # wildcard is needed after BOTH owner and name to absorb the
                # @<owner-id> and @<repo-id> suffixes, so GitHubRepo (owner/name)
                # is split and each half gets a trailing *.
                token.actions.githubusercontent.com:sub: !Sub
                  - 'repo:${Owner}*/${Name}*:ref:refs/heads/${GitHubBranch}'
                  - Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                    Name: !Select [1, !Split ['/', !Ref GitHubRepo]]
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Sync the built site into the site bucket (list + put/delete objects).
              - Sid: SiteBucketWrite
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: SiteObjectWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              # Invalidate the cache so new deploys are visible immediately.
              - Sid: InvalidateDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}'

# ---------------------------------------------------------------------------
Outputs:
  CloudFrontDomainName:
    Description: CloudFront distribution domain (serves the static site).
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Description: CloudFront distribution id (for cache invalidations).
    Value: !Ref Distribution
  GitHubDeployRoleArn:
    Condition: HasGitHubRepo
    Description: >-
      ARN of the GitHub Actions OIDC deploy role. Set as the AWS_DEPLOY_ROLE_ARN
      GitHub Actions variable (or repo secret).
    Value: !GetAtt GitHubDeployRole.Arn
  ApiEndpoint:
    Description: The /ac/subscribe URL to paste into PUBLIC_AC_FORM_ENDPOINT.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/ac/subscribe'
  OAuthBaseUrl:
    Condition: HasOAuth
    Description: >-
      Base URL of the CMS OAuth relay. Set as backend.base_url in
      public/admin/config.yml. The /auth and /callback paths live under it.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  OAuthCallbackUrl:
    Condition: HasOAuth
    Description: >-
      The GitHub OAuth App "Authorization callback URL" / Redirect URI must be
      set to EXACTLY this value.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/callback'
  OAuthSecretArn:
    Condition: HasOAuth
    Description: ARN of the GitHub OAuth client-secret (set the real value out-of-band).
    Value: !Ref OAuthSecret
  SiteBucketName:
    Description: Name of the private site bucket (aws s3 sync dist/ here).
    Value: !Ref SiteBucket
  MediaBucketName:
    Description: Name of the private media bucket (upload under the media/ prefix).
    Value: !Ref MediaBucket
  AcSecretArn:
    Description: ARN of the AC API key secret (set the real value out-of-band).
    Value: !Ref AcSecret
  CmsRepo:
    Description: GitHub repo configured for the CMS backend (fill in public/admin/config.yml).
    Value: !Ref CmsRepo
  CmsBranch:
    Description: GitHub branch configured for the CMS backend (fill in public/admin/config.yml).
    Value: !Ref CmsBranch
