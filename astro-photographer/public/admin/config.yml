backend:
  name: github
  repo: emgeier/PhotographerSite
  branch: main
  # OAuth relay = the AWS HTTP API (OAuthBaseUrl stack output). The CMS opens
  # <base_url>/auth to start login and the relay returns the token from
  # <base_url>/callback. REPLACE <api-id> with the real HttpApi id once the
  # stack is deployed with OAuthClientId set (it equals the ApiEndpoint host).
  base_url: https://tbrubqn47k.execute-api.us-east-2.amazonaws.com
  auth_endpoint: /auth

# All backend paths are relative to the REPO ROOT. The Astro app lives in the
# astro-photographer/ subdirectory, so every repo path is prefixed accordingly.
# public_folder stays /images because that is the URL path the built site
# serves from (not a repo path).
media_folder: astro-photographer/public/images   # CMS-uploaded images commit here -> dist/images -> site bucket
public_folder: /images                           # referenced as /images/... (site origin, NOT the /media/* media prefix)

collections:
  # Site settings — a single JSON file. The gallery caption pool is the shared
  # default used for any story-gallery photo without a bespoke caption.
  - name: settings
    label: Settings
    files:
      - name: gallery
        label: Gallery captions (shared pool)
        file: astro-photographer/src/content/settings/gallery.json
        fields:
          - name: galleryCaptions
            label: Editorial caption pool
            widget: list
            field: { name: caption, label: Caption, widget: string }
            hint: 'Default captions used for story-gallery photos that have no bespoke caption. Applied in order, rotating by photo position.'

      - name: experience
        label: 'The Experience page — images'
        file: astro-photographer/src/content/settings/experience.json
        fields:
          - { name: heroImage, label: Hero image, widget: image, required: false }
          - name: processImages
            label: Process step images (3, in order)
            widget: list
            field: { name: image, label: Image, widget: image }
            hint: 'Consultation, Session, Reveal — one image each, in order.'
          - name: insideImages
            label: Inside-the-experience grid images (4)
            widget: list
            field: { name: image, label: Image, widget: image }
          - { name: ctaImage, label: Closing CTA background image, widget: image, required: false }

      - name: inquire
        label: 'Inquire page — images'
        file: astro-photographer/src/content/settings/inquire.json
        fields:
          - { name: contactHeroImage, label: Hero image, widget: image, required: false }
          - { name: contactHeroImageMobile, label: 'Hero image — mobile version (optional; used on phones for better framing)', widget: image, required: false }
          - { name: contactAboutImage, label: 'About (black-and-white portrait)', widget: image, required: false }
          - { name: contactStepsImage, label: 'Steps band image', widget: image, required: false }
          - { name: contactCloseImage, label: Closing image, widget: image, required: false }

      - name: stories
        label: 'Muse Stories page — images'
        file: astro-photographer/src/content/settings/stories.json
        fields:
          - { name: storiesHeroImage, label: Hero image, widget: image, required: false }
          - { name: lookAgainImage, label: '“Look again” band image', widget: image, required: false }
          - { name: motionImage, label: '“In motion” poster image', widget: image, required: false }
          - { name: storiesCtaImage, label: Closing CTA image, widget: image, required: false }

      - name: home
        label: 'Muse Home page — images'
        file: astro-photographer/src/content/settings/home.json
        fields:
          - { name: homeHeroImage, label: Hero image, widget: image, required: false }
          - { name: homeHeroImageMobile, label: 'Hero image — mobile version (optional; used on phones for better framing)', widget: image, required: false }
          - { name: homePortraitImage, label: '“Look again” portrait', widget: image, required: false }
          - { name: homeClosingImage, label: Closing image, widget: image, required: false }
          - { name: homeExperienceImage, label: 'Experience section background', widget: image, required: false }

      - name: apexhome
        label: 'Studio hub (/) — images'
        file: astro-photographer/src/content/settings/apexhome.json
        fields:
          - { name: apexHeroImage, label: 'Hero slide 1 (main)', widget: image, required: false, hint: '¿Necesitas ayuda? Lee la guía: /admin/guia.html — El hero rota entre 3 fotos. Recuerda Save y luego Publish.' }
          - { name: apexHeroImage2, label: 'Hero slide 2', widget: image, required: false }
          - { name: apexHeroImage3, label: 'Hero slide 3', widget: image, required: false }
          - { name: apexWeddingsCardImage, label: Weddings card image, widget: image, required: false }
          - { name: apexGlamCardImage, label: Glam Muse card image, widget: image, required: false }
          - { name: apexBeautyImage, label: Beauty section image, widget: image, required: false }
          - { name: apexBeautyInsetImage, label: 'Beauty inset (B&W)', widget: image, required: false }
          - { name: apexMeetImage, label: Meet Luis portrait, widget: image, required: false }
          - { name: apexCtaImage, label: Closing CTA background, widget: image, required: false }

      - name: portfolio
        label: 'Portfolio page — images'
        file: astro-photographer/src/content/settings/portfolio.json
        fields:
          - { name: portfolioHeroImage, label: Hero image, widget: image, required: false }
          - { name: portfolioBannerImage, label: Manifesto banner image, widget: image, required: false }
          - { name: portfolioFilmImage, label: Experience film still, widget: image, required: false }
          - { name: portfolioClosingImage, label: Closing image, widget: image, required: false }
          - name: portfolioGallery
            label: 'Portrait gallery (add photos — you can select several at once in the media window; leave empty to use the built-in set)'
            widget: list
            label_singular: Portrait
            required: false
            summary: '{{fields.title | default(fields.image)}}'
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: 'Alt text (describe the photo for accessibility/SEO)', widget: string, required: false }
              - { name: title, label: 'Title (shown in the popup, optional)', widget: string, required: false }
              - { name: caption, label: 'Caption (shown in the popup, optional)', widget: string, required: false }

      - name: landing
        label: 'Landing page (muse/landing) — content'
        file: astro-photographer/src/content/settings/landing.json
        fields:
          - { name: museEyebrow, label: 'Hero eyebrow', widget: string, required: false }
          - { name: museName, label: 'Muse name', widget: string, required: false }
          - { name: museSub, label: 'Hero subtitle', widget: string, required: false }
          - { name: museLede, label: 'Hero lede', widget: text, required: false }
          - { name: landingHeroImage, label: 'Hero image', widget: image, required: false }
          - { name: filmPoster, label: 'Film poster image', widget: image, required: false }
          - { name: filmTitle, label: 'Film — title', widget: string, required: false }
          - { name: filmCopy, label: 'Film — copy', widget: text, required: false }
          - { name: filmVideoUrl, label: 'Film — video link (optional)', widget: string, required: false }
          - name: landingGallery
            label: 'Portrait gallery (clickable)'
            widget: list
            field: { name: image, label: Image, widget: image }
          - { name: deserveTitle, label: '“You deserve this” — title', widget: string, required: false }
          - { name: deservePara1, label: '“You deserve this” — paragraph 1', widget: text, required: false }
          - { name: deservePara2, label: '“You deserve this” — paragraph 2', widget: text, required: false }
          - { name: deserveSignature, label: '“You deserve this” — signature', widget: string, required: false }
          - { name: deserveImage, label: '“You deserve this” — photo', widget: image, required: false }
          - { name: landingCtaTitle, label: 'Closing CTA — title', widget: string, required: false }
          - { name: landingCtaCopy, label: 'Closing CTA — copy', widget: text, required: false }
          - { name: landingCtaImage, label: 'Closing CTA — background image', widget: image, required: false }

      - name: link
        label: 'Instagram link page (/connect) — content'
        file: astro-photographer/src/content/settings/link.json
        fields:
          - { name: linkPortrait, label: 'Portrait (circular)', widget: image, required: false }
          - { name: linkGreeting, label: 'Greeting (gold italic, e.g. “Hola,”)', widget: string, required: false }
          - { name: linkName, label: 'Name', widget: string, required: false }
          - { name: linkTagline, label: 'Tagline', widget: string, required: false }
          - { name: linkLocation, label: 'Location line', widget: string, required: false }
          - { name: linkPhone, label: 'Call link (tel: URL)', widget: string, required: false, hint: 'e.g. tel:+16155551234' }
          - { name: linkEmail, label: 'Email link (mailto: URL)', widget: string, required: false, hint: 'e.g. mailto:hello@luisquintanastudio.com' }
          - name: linkCards
            label: 'Cards'
            widget: list
            label_singular: Card
            summary: '{{fields.titleMain}}'
            fields:
              - { name: kind, label: 'Kind (glam or weddings — controls image crop)', widget: string, required: false }
              - { name: image, label: 'Image', widget: image, required: false }
              - { name: titleTop, label: 'Title — top line (small, optional)', widget: string, required: false }
              - { name: titleMain, label: 'Title — main line', widget: string, required: false }
              - { name: titleMain2, label: 'Title — second main line (optional)', widget: string, required: false }
              - { name: titleBottom, label: 'Title — bottom line (small, optional)', widget: string, required: false }
              - { name: sub, label: 'Subtitle (italic)', widget: string, required: false }
              - { name: button, label: 'Button label', widget: string, required: false }
              - { name: href, label: 'Button link', widget: string, required: false }
              - { name: external, label: 'Opens in new tab (external)', widget: boolean, default: false, required: false }
          - { name: linkFooter, label: 'Footer line', widget: string, required: false }

      - name: weddings-home
        label: 'Weddings — Home images'
        file: astro-photographer/src/content/settings/weddings-home.json
        fields:
          - { name: wedHomeHeroImage, label: Hero image, widget: image, required: false, hint: '¿Necesitas ayuda? Lee la guía: /admin/guia.html — Recuerda hacer Save y luego Publish.' }
          - { name: wedHomePhiloImage, label: Philosophy photo, widget: image, required: false }
          - { name: wedHomeWeddingsCardImage, label: Weddings card image, widget: image, required: false }
          - { name: wedHomeEngagementsCardImage, label: Engagements card image, widget: image, required: false }
          - { name: wedHomeAboutImage, label: About portrait, widget: image, required: false }
          - { name: wedHomeCtaImage, label: Closing CTA background, widget: image, required: false }

      - name: weddings-experience
        label: 'Weddings — Experience images'
        file: astro-photographer/src/content/settings/weddings-experience.json
        fields:
          - { name: wedExperienceHeroImage, label: Hero image, widget: image, required: false }
          - { name: wedExperienceEasePhoto, label: '“At ease” photo', widget: image, required: false }
          - name: wedExperienceStepImages
            label: 'Process step images (3, in order — also shown on the Weddings home page)'
            widget: list
            required: false
            field: { name: image, label: Image, widget: image }
            hint: 'Consultation, Planning, Your Day — one image each, in order. Shared by the Experience page and the Weddings home experience section.'
          - { name: wedExperienceCtaImage, label: Closing CTA background, widget: image, required: false }

      - name: weddings-portfolio
        label: 'Weddings — Portfolio images'
        file: astro-photographer/src/content/settings/weddings-portfolio.json
        fields:
          - { name: wedPortfolioHeroImage, label: Hero image, widget: image, required: false }
          - { name: wedPortfolioVideoImage, label: Video testimonial image, widget: image, required: false }
          - { name: wedPortfolioCtaImage, label: Closing CTA background, widget: image, required: false }
          - name: wedPortfolioGallery
            label: 'Gallery photos (add photos — you can select several at once in the media window; leave empty to use the built-in set)'
            widget: list
            label_singular: Photo
            required: false
            summary: '{{fields.alt | default(fields.image)}}'
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: 'Alt text (describe the photo for accessibility/SEO)', widget: string, required: false }

      - name: weddings-faq
        label: 'Weddings — FAQ images'
        file: astro-photographer/src/content/settings/weddings-faq.json
        fields:
          - { name: wedFaqHeroImage, label: Hero image, widget: image, required: false }
          - { name: wedFaqCtaImage, label: Closing CTA background, widget: image, required: false }

      - name: weddings-engagements
        label: 'Weddings — Engagements images'
        file: astro-photographer/src/content/settings/weddings-engagements.json
        fields:
          - { name: wedEngagementsHeroImage, label: Hero image, widget: image, required: false }
          - { name: wedEngagementsVideoImage, label: Featured session image, widget: image, required: false }
          - { name: wedEngagementsCtaImage, label: Closing CTA background, widget: image, required: false }
          - name: wedEngagementsGallery
            label: 'Gallery photos (add photos — you can select several at once in the media window; leave empty to use the built-in set)'
            widget: list
            label_singular: Photo
            required: false
            summary: '{{fields.alt | default(fields.image)}}'
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: 'Alt text (describe the photo for accessibility/SEO)', widget: string, required: false }

      - name: weddings-inquire
        label: 'Weddings — Inquire images'
        file: astro-photographer/src/content/settings/weddings-inquire.json
        fields:
          - { name: wedInquireHeroImage, label: Hero image, widget: image, required: false }
          - { name: wedInquireFormImage, label: Form aside image, widget: image, required: false }
          - { name: wedInquireNoteImage, label: '“A note from Luis” portrait', widget: image, required: false }
          - { name: wedInquireCtaImage, label: Closing CTA background, widget: image, required: false }

      - name: weddings-testimonials
        label: 'Weddings — Testimonials images'
        file: astro-photographer/src/content/settings/weddings-testimonials.json
        fields:
          - { name: wedTestimonialsHeroImage, label: Hero image, widget: image, required: false }
          - { name: wedTestimonialsFeaturedPhoto, label: Featured pull-quote photo, widget: image, required: false }
          - { name: wedTestimonialsVideoImage, label: Video testimonial image, widget: image, required: false }
          - { name: wedTestimonialsCtaImage, label: Closing CTA background, widget: image, required: false }

      - name: weddings-about
        label: 'Weddings — About images'
        file: astro-photographer/src/content/settings/weddings-about.json
        fields:
          - { name: wedAboutHeroImage, label: Hero portrait, widget: image, required: false }
          - { name: wedAboutLifeImage, label: '“A life inspired” photo', widget: image, required: false }
          - { name: wedAboutPhiloImage, label: Philosophy band image, widget: image, required: false }
          - { name: wedAboutVideoImage, label: '“A few words” video image', widget: image, required: false }
          - { name: wedAboutCtaImage, label: Closing CTA background, widget: image, required: false }

      - name: weddings-stories
        label: 'Weddings — Love Stories images'
        file: astro-photographer/src/content/settings/weddings-stories.json
        fields:
          - { name: wedStoriesHeroImage, label: Listing hero image, widget: image, required: false }
          - { name: wedStoriesCtaImage, label: Listing closing CTA background, widget: image, required: false }
          - { name: wedStoryDetailCtaImage, label: Story detail closing CTA background, widget: image, required: false }

      - name: enter-to-win-a-free-engagement-session
        label: 'Weddings — Engagement Giveaway images'
        file: astro-photographer/src/content/settings/enter-to-win-a-free-engagement-session.json
        fields:
          - { name: wedGiveawayHeroImage, label: Hero image (the offer), widget: image, required: false }
          - { name: wedGiveawayClosingImage, label: Closing couple image, widget: image, required: false }
          - { name: wedGiveawayMeetImage, label: Meet Luis portrait, widget: image, required: false }
          - name: wedGiveawayGallery
            label: 'Engagements gallery (up to 10 — leave empty to use placeholders)'
            widget: list
            required: false
            field: { name: image, label: Image, widget: image }

  - name: muses
    label: Muses
    folder: astro-photographer/src/content/muses
    create: true
    slug: '{{slug}}'              # filename-based: the entry's own slug == entry.id
    fields:
      - { name: number, label: Number, widget: string }
      - { name: order, label: Order, widget: number, value_type: int, hint: 'Orden de aparición (1, 2, 3…). Usa un número que no se repita. Guía: /admin/guia.html' }
      - { name: name, label: Name, widget: string }
      - { name: tagline, label: Tagline, widget: string }
      - { name: featured, label: Featured, widget: boolean, default: false, hint: 'Actívalo en SOLO UNA musa; si lo haces, llena también Featured paragraph.' }
      - { name: cardImage, label: Card image, widget: image, required: false }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: gallery
        label: Gallery
        widget: list
        required: false
        label_singular: Photo
        summary: '{{fields.caption | default(fields.image)}}'
        fields:
          - { name: image, label: Image, widget: image }
          - { name: caption, label: Caption (optional — defaults to the shared editorial pool), widget: string, required: false }
      - { name: beforeImage, label: Before, widget: image, required: false }
      - { name: afterImage, label: After, widget: image, required: false }
      - { name: motionImage, label: 'In Motion — poster image', widget: image, required: false, hint: 'Poster frame for the "In motion" section. Leave blank to use the shared placeholder.' }
      # videoUrl: an https://<cloudfront-domain>/media/... URL (served through
      # CloudFront, never a raw S3 URL — OAC blocks direct reads). The schema is
      # z.string().url(), so a non-URL (or a value missing /media/) fails the build;
      # the pattern steers authors. Blank -> the key is omitted from the Markdown
      # and the "In motion" poster shows "Coming soon" instead of linking out.
      - name: videoUrl
        label: 'In Motion — video link (S3 via CloudFront)'
        widget: string
        required: false
        hint: 'Optional. The "In motion" poster links to this film in a new tab. Leave blank for a "Coming soon" placeholder.'
        pattern: ['^https://.+/media/.+', 'Must be a https://<cloudfront-domain>/media/... URL']
      - { name: heroPara, label: Hero paragraph (suffix, no first name), widget: text, required: false }
      - { name: introPara, label: Intro paragraph, widget: text, required: false }
      - { name: transformPara, label: Transform paragraph, widget: text, required: false }
      - { name: featuredPara, label: Featured paragraph (full text), widget: text, required: false, hint: 'Required when Featured is on — the stories.astro featured block renders this verbatim.' }
      # `body` is the implicit Content-Layer Markdown body (not a schema key);
      # not rendered by the pages yet, reserved for future free-form notes.
      - { name: body, label: Body (notes), widget: markdown, required: false }

  - name: weddingStories
    label: 'Wedding Stories'
    folder: astro-photographer/src/content/weddingStories
    create: true
    slug: '{{slug}}'              # filename-based: the entry's own slug == entry.id
    fields:
      - { name: order, label: Order, widget: number, value_type: int, hint: 'Orden de aparición (1, 2, 3…). Usa un número que no se repita. Guía: /admin/guia.html' }
      - { name: type, label: Type, widget: select, options: ['Wedding', 'Engagement'], default: 'Wedding' }
      - { name: names, label: Names, widget: string }
      - { name: place, label: Place, widget: string }
      - { name: featured, label: Featured, widget: boolean, default: false, hint: 'Actívalo en SOLO UNA historia: esa aparece destacada arriba.' }
      - { name: cardImage, label: Card image, widget: image, required: false }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - { name: introTitle, label: Intro title, widget: string }
      - name: introParas
        label: Intro paragraphs
        widget: list
        field: { name: paragraph, label: Paragraph, widget: text }
      - name: gallery
        label: Gallery
        widget: list
        field: { name: image, label: Image, widget: image }
      - { name: quoteText, label: Quote text, widget: string }
      - { name: quoteAttribution, label: Quote attribution, widget: string }
